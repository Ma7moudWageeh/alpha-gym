appId: com.alphagym.management
productName: Alpha Gym
copyright: Copyright © 2026 Alpha Gym

# Output directory for distributable artifacts
directories:
  output: dist/installers

# Files to include in the app package
files:
  - "electron/**/*"
  - "dist/**/*"
  - "!dist/installers/**"
  - "bill/**/*"
  - "package.json"

# Enable ASAR packaging
asar: false

# Windows-specific configuration
win:
  artifactName: Alpha-Gym-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  icon: src/assets/icon.ico

# NSIS installer configuration (Windows)
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Alpha Gym

publish:
  provider: github
  owner: "Ma7moudWageeh"
  repo: "alpha-gym"
